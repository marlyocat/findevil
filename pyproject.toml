[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findevil"
version = "0.1.0"
description = "Autonomous AI agent for incident response forensics via MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["src/findevil"]

[tool.hatch.build.targets.wheel.force-include]
"src/findevil/data/threat_intel.json" = "findevil/data/threat_intel.json"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.coverage.run]
source = ["findevil"]
branch = true
omit = [
    # __main__.py is a 5-line shim; no logic worth covering.
    "*/findevil/__main__.py",
]

[tool.coverage.report]
# Don't count `if TYPE_CHECKING:` blocks or pragma-marked branches.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
show_missing = true
skip_covered = false
