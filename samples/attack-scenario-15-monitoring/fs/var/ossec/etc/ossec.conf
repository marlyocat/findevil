<!--
  Wazuh Agent - Manager Configuration
  Standard corporate rollout. Do NOT modify without change-management approval.
  Contact: sec-eng@corp.internal
-->
<ossec_config>
  <client>
    <server>
      <address>wazuh.corp.internal</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>linux, production, ubuntu24</config-profile>
    <notify_time>60</notify_time>
    <time-reconnect>300</time-reconnect>
    <auto_restart>yes</auto_restart>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh-enroll.corp.internal</manager_address>
      <port>1515</port>
      <agent_name>webserver-prod-15</agent_name>
      <server_ca_path>/etc/pki/tls/certs/corp-internal-ca.pem</server_ca_path>
    </enrollment>
  </client>

  <rootcheck>
    <disabled>no</disabled>
  </rootcheck>

  <syscheck>
    <frequency>43200</frequency>
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin,/bin,/sbin</directories>
  </syscheck>
</ossec_config>
